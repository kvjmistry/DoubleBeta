files_in    = "{filein}"
file_out    = "{fileout}"
compression = "ZLIB4"
run_number  = 13850
detector_db = "next100"
print_mod   = 10

# max number of events to run
event_range = all

n_baseline     =   62400

# Set Moving Average Window (MAW) for calibrated sum
n_maw   = 100          # 100*25 = 2.5mus
thr_maw = 10 * adc

# Set thresholds for calibrated sum
thr_csum_s1 = 0.1 * pes
thr_csum_s2 = 0.5 * pes

# Set parameters to search for S1
s1_tmin       =   0 * mus
s1_tmax       =   1580 * mus 
s1_stride     =   1
s1_lmin       =   8
s1_lmax       =  400
s1_rebin_stride = 1

# Set parameters to search for S2
s2_tmin     =    1580 * mus  # do not consider full window to speed up 
s2_tmax     =    2600 * mus  # end of the window
s2_stride   =     20        #  40 x 25 = 1   mus
s2_lmin     =    400        # 400 x 25 = 10 mus
s2_lmax     = 100000        # maximum value of S2 width
s2_rebin_stride = 80        # Rebin by default, 80x25 ns time bins to make 2us time bin

pmt_samp_wid  = 25 * ns
sipm_samp_wid =  1 * mus

cutting_function = pyrrha
cutting_params   = dict(selection_method    = median_std_method,
                              selection_kwargs    = {'nsigma': 3},
			      			  proximity_threshold = 25,
                              padding_radius      = 50,		
			      			  run_number          = run_number,
			      			  detector_db         = detector_db)